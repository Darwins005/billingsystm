<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e40af">
<title>Textile Billing</title>
<style>
:root{--pri:#1e40af;--bg:#f3f5f9;--card:#fff;--bd:#dde2ea;--tx:#1b2433;--mut:#6b7686;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
[hidden]{display:none!important}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 10px;font-size:16px}
small,.mut{color:var(--mut);font-weight:400}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #93b4ff;border-color:#6d94f5}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
.btn{border:1px solid var(--bd);background:#fff;padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;color:var(--tx);white-space:nowrap}
.btn:hover{background:#f1f4fa}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>select,.row>input{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form .span2{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{display:block;font-size:22px;margin-top:4px}
.stat span{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.note{font-size:13px;color:var(--mut);margin-top:6px;white-space:pre-line}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
/* layout */
#app{display:flex;min-height:100vh}
nav{width:210px;background:#0f1b3d;color:#fff;padding:14px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;flex-shrink:0}
nav .brand{font-weight:700;padding:6px 10px 14px;font-size:16px}
nav a{padding:10px 12px;border-radius:8px;color:#cbd5f0;cursor:pointer;text-decoration:none;display:flex;gap:10px;align-items:center;white-space:nowrap}
nav a:hover{background:#1c2c5c}nav a.on{background:var(--pri);color:#fff}
nav .badge{background:#f59e0b;color:#111;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;margin-left:auto}
nav .sync{margin-top:auto;font-size:12px;color:#94a3d0;padding:8px 10px}
main{flex:1;padding:20px;min-width:0;max-width:1200px}
@media(max-width:860px){
 #app{flex-direction:column}
 nav{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;overflow-x:auto;padding:6px;gap:4px}
 nav .brand,nav .sync{display:none}
 nav a{padding:8px 11px;font-size:14px}
 main{padding:12px}
 .grid2,.form,.grid3{grid-template-columns:1fr}
}
/* tables */
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th{background:#eef1f7;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);padding:9px 10px;white-space:nowrap}
table.t td{padding:9px 10px;border-top:1px solid var(--bd);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tfoot td{font-weight:700;background:#f8fafc}
.pill{padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;display:inline-block}
.pill.Paid{background:#dcfce7;color:var(--ok)}.pill.Unpaid{background:#fee2e2;color:var(--bad)}.pill.Partial{background:#fef3c7;color:var(--warn)}
.pill.q{background:#e0e7ff;color:#3730a3}.pill.invb{background:#dbeafe;color:#1e40af}.pill.dcb{background:#ede9fe;color:#6d28d9}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:600;font-size:14px;color:var(--mut)}.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.dcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:start}.dcb2 .dch{display:flex;gap:6px;align-items:flex-end;margin-bottom:8px}.dcb2 .dch>div{flex:1}.dcb2 .dch input{margin:0}.dcb2 .rmc{border:1px solid #fca5a5;background:#fff;color:#b91c1c;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px}.dcb2 table.t td{padding:3px 6px}.mt{padding:5px 7px!important;text-align:right}
.acts{display:flex;gap:4px;flex-wrap:wrap}
/* invoice editor */
.lrow{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-items:end;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--bd)}
.lrow>:nth-child(1){grid-column:span 2}.lrow>:nth-child(2){grid-column:span 3}.lrow>:nth-child(3){grid-column:span 4}.lrow>:nth-child(4){grid-column:span 3}.lrow>:nth-child(5){grid-column:span 2}.lrow>:nth-child(6){grid-column:span 3}.lrow>:nth-child(7){grid-column:span 2}.lrow>:nth-child(8){grid-column:span 2}.lrow>:nth-child(9){grid-column:span 2}.lrow>:nth-child(10){grid-column:span 1}
.grid3{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
@media(max-width:1150px){.card.grid2{grid-template-columns:1fr}}
.lrow .amt{padding:9px 4px;font-weight:700;text-align:right}
.x{border:0;background:#fee2e2;color:var(--bad);border-radius:8px;height:38px;cursor:pointer;font-weight:700}
.erow{display:grid;grid-template-columns:2fr 1fr 34px;gap:8px;margin-bottom:8px}
@media(max-width:860px){
 .lrow{grid-template-columns:1fr 1fr}.lrow>*{grid-column:auto!important}.lrow .svc{grid-column:1/-1!important}.lrow .x{grid-column:1/-1!important}
}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px dashed #9aa6bd;background:#fff;border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:420px}
.tot div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.tot .big{font-size:18px;font-weight:700;border-top:2px solid var(--tx);padding-top:6px}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;display:flex;gap:8px;flex-wrap:wrap}
/* chart */
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:10px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pri);border-radius:5px 5px 0 0;min-height:2px}
/* modal / toast */
.mback{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
.mbox{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:560px}
.mbox.wide{max-width:900px;background:#e5e8ee}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px;max-width:90%}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg,#f3f4f8);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#gate .card{width:100%;max-width:380px;box-shadow:0 10px 30px rgba(15,27,61,.12)}
#gate h2{margin:0 0 4px;text-align:center}#gate .mut{text-align:center;margin:0 0 16px}
#gate .chk{display:flex;gap:6px;align-items:center;font-size:13px;margin:8px 0 0;font-weight:400;cursor:pointer}#gate .chk input{width:auto}
#gate .lnk{display:block;margin:12px auto 0;background:none;border:0;color:var(--pri,#1e40af);font-size:13px;cursor:pointer;text-decoration:underline;padding:2px 6px}
#gate .rec{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd,#e5e7eb)}
#logoutBtn{position:fixed;top:8px;right:10px;z-index:60;padding:6px 14px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
main{padding-top:50px}
@media(max-width:860px){#logoutBtn{top:6px;right:6px;z-index:30}main{padding-top:12px}nav{padding-right:84px!important}}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login .card{width:100%;max-width:380px}
/* ===== invoice (screen + print) ===== */
.inv{background:#fff;color:#000;width:100%;max-width:800px;margin:0 auto 16px;padding:10px 12px;border:1.5px solid #000;font-family:Arial,Helvetica,sans-serif;line-height:1.3;-webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-direction:column}
.inv .tl{text-align:center;font-weight:700;font-size:1.5em;letter-spacing:1px;position:relative;margin-bottom:2px}
.inv .tl span{position:absolute;right:0;top:4px;font-size:.5em;font-weight:400;letter-spacing:0}
.inv .hd{display:flex;gap:16px;align-items:center;padding:4px 0 8px}
.inv .hd img{max-height:80px;max-width:170px;object-fit:contain;flex-shrink:0}
.inv .co{flex:1}
.inv .co h1{margin:0 0 2px;font-size:1.45em;letter-spacing:.3px}
.inv table{width:100%;border-collapse:collapse;table-layout:fixed}
.inv th,.inv td{border:1px solid #000;padding:3px 6px;vertical-align:middle;word-wrap:break-word}
.inv th{background:#d9d9d9;color:#000;font-size:.92em;text-align:center}
.inv td.r{text-align:right}.inv td.c{text-align:center}
.inv .meta td{width:25%;font-weight:700}
.inv .cd{margin:8px 0 6px}
.inv .cd>b{font-size:1.1em;display:block;margin-bottom:3px}
.inv .cd table{border:0}.inv .cd td{border:0;padding:1px 6px 1px 0;vertical-align:top}
.inv .cd td:first-child{width:105px;white-space:nowrap}
.inv .items th{padding:5px 3px}
.inv .items td{padding:5px 4px}
.inv .items tbody td{border-top:0;border-bottom:0}
.inv .items tbody tr:last-child td{border-bottom:1px solid #000}
.inv .items tr.fl td{height:2.1em}
.inv .sumrow{display:flex;gap:0;align-items:stretch}
.inv .sumrow .gl{flex:1;padding-top:8px;align-self:flex-end}
.inv .sumrow .gr{width:36%}
.inv .gr td{font-weight:700}
.inv .gr td:first-child{text-align:right;width:55%}
.inv .gr tr.gtot td{font-size:1.1em;background:#eee}
.inv .words{border:1px solid #000;border-top:0;padding:5px 7px;font-weight:700;margin-bottom:8px}
.inv .bk{width:62%;margin-bottom:8px}
.inv .bk th{text-align:left;background:#d9d9d9;width:20%}
.inv .bot{margin-top:auto}
.inv .ft{display:flex;gap:10px;justify-content:space-between;min-height:95px}
.inv .ft .terms{flex:1;font-size:.95em;white-space:pre-line}
.inv .ft .sig{text-align:right;display:flex;flex-direction:column;justify-content:space-between;min-width:38%}
.inv .ck{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:26px;align-items:end}
.inv .ck div{text-align:center;line-height:1.8}
.inv.dc .hd{display:block;position:relative;text-align:center;padding:4px 0 8px}
.inv.dc .hd img{position:absolute;left:0;top:50%;transform:translateY(-50%);max-height:70px;max-width:120px}
.inv.dc .co{text-align:center;width:100%}
.inv.dc .co div{text-align:center}
.inv .dco h1{font-size:1.6em;font-weight:700;letter-spacing:.3px;margin:0 0 3px;font-family:inherit}
.inv .dm td{font-weight:700;width:auto}
.inv .dbody{display:flex;gap:8px;margin:8px 0 6px;align-items:flex-start}
.inv .dbody .dr{width:34%}.inv .dr .big{font-size:1.4em;font-weight:700;height:2em}
.inv .spec td{width:25%}
.inv .dcw{display:flex;gap:6px;justify-content:center;align-items:flex-start;margin-top:6px}.inv .dcw .dcg{flex:1 1 0;max-width:50%;margin-top:0}.inv .dcg col.cs{width:30%}.inv .dcg col.cm{width:70%}.inv .dcg{margin-top:6px}.inv .dcg th{padding:3px}.inv .dcg td{padding:1px 4px;height:1.9em}.inv .dcg tfoot td.c{white-space:nowrap}
.inv .dcg tbody td{height:1.9em}.inv .dcg tfoot td{font-weight:700;background:#eee}
.inv .dn{font-size:.9em;margin:6px 0 4px;font-weight:700}
.inv .dfl{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;align-self:flex-end}
.inv .dfl div{border-bottom:1px solid #000;min-height:1.9em}
#printArea{display:none}
@media print{
 body{background:#fff}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 .inv{max-width:none;margin:0;padding:6px 8px;min-height:var(--ph,0);page-break-after:always;break-after:page;page-break-inside:avoid}
 .inv:last-child{page-break-after:auto;break-after:auto}
}
</style>

function words(total){
 const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
 const three=x=>(x>99?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
 const conv=n=>{if(n===0)return'Zero';let s='';const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;

 const rup=Math.floor(total+1e-9),ps=Math.round((total-rup)*100);
 return 'Rupees '+conv(rup)+(ps?' and '+two(ps)+' Paise':'')+' Only';
}

function persist(){try{localStorage.setItem('tb_data',JSON.stringify(S))}catch(e){toast('Browser storage is full!')}}

function put(col,o){
 if(!o.id)o.id=uid();
 const a=S[col],i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;
 if(fs)fs.collection(col).doc(o.id).set(clone(o)).catch(e=>toast('Sync error: '+e.message));else persist();
 return o;
}
function del(col,id){
 S[col]=S[col].filter(x=>x.id!==id);
 if(fs)fs.collection(col).doc(id).delete().catch(e=>toast('Sync error: '+e.message));else persist();
}
function saveCompany(){if(fs)fs.doc('meta/company').set(clone(S.company)).catch(e=>toast('Sync error: '+e.message));else persist()}
async function nextSeq(kind){
 const key=kind==='dc'?'dcCounter':'counter';
 if(fs){const ref=fs.doc('meta/'+key);return fs.runTransaction(async t=>{const d=await t.get(ref);const n=(d.exists?d.data().n:0)+1;t.set(ref,{n});return n})}
 const n=(S.meta[key]||0)+1;S.meta[key]=n;persist();return n;
}
function setCounter(n,kind){const key=kind==='dc'?'dcCounter':'counter';S.meta[key]=n;if(fs)fs.doc('meta/'+key).set({n});else persist()}
function fmtNo(kind,n){const c=S.company;return kind==='dc'?(c.dcPrefix||'')+n:(c.prefix||'')+String(n).padStart(+c.pad||1,'0')}
function bumpCounter(kind,no){const c=S.company,pre=kind==='dc'?(c.dcPrefix||''):(c.prefix||'');if(!no.startsWith(pre))return;const rest=no.slice(pre.length);if(!/^\d+$/.test(rest))return;const n=+rest,cur=S.meta[kind==='dc'?'dcCounter':'counter']||0;if(n>cur)setCounter(n,kind)}
function okNo(col,no,id){const d=S[col].find(x=>x.no===no&&x.id!==id);return !d||confirm('Number "'+no+'" is already used by another document. Save with the same number anyway?')}
async function assignNo(doc,kind,col){
 const typed=(doc.no||'').trim();
 if(!doc.id){
  if(!doc.noAuto&&typed){if(!okNo(col,typed,null))return false;doc.no=typed;doc.seq=0;bumpCounter(kind,typed)}
  else{try{const n=await nextSeq(kind);doc.seq=n;doc.no=fmtNo(kind,n)}catch(e){toast('Could not get a number (check internet): '+e.message);return false}}
  doc.id=uid();doc.printed=false;doc.created=Date.now();return true;
 }
 if(!typed){toast('Please enter a number');return false}
 const old=S[col].find(x=>x.id===doc.id);
 if(old&&old.no!==typed&&!okNo(col,typed,doc.id))return false;
 doc.no=typed;return true;
}

/* ---------------- calculations ---------------- */
function stateOf(cu){const g=(cu&&cu.gstin||'').slice(0,2);return /^\d{2}$/.test(g)?g:(cu&&cu.stateCode)||S.company.stateCode}
function taxType(inv){
 if(inv.taxMode==='intra'||inv.taxMode==='inter')return inv.taxMode;
 return stateOf(inv.cust||{})===S.company.stateCode?'intra':'inter';
}
function calc(inv){
 const lines=inv.lines||[];let taxable=0;const g={};
 lines.forEach(l=>{const a=r2((+l.qty||0)*(+l.rate||0));taxable+=a;const k=+l.gst||0;g[k]=(g[k]||0)+a});
 taxable=r2(taxable);const tt=taxType(inv);let cgst=0,sgst=0,igst=0;const groups=[];
 Object.keys(g).map(Number).sort((a,b)=>a-b).forEach(k=>{
  const t=r2(g[k]*k/100);
  if(tt==='intra'){const h=r2(t/2);cgst+=h;sgst+=r2(t-h)}else igst+=t;
  groups.push({rate:k,taxable:r2(g[k]),tax:t});
 });
 cgst=r2(cgst);sgst=r2(sgst);igst=r2(igst);
 const totalTax=r2(cgst+sgst+igst),raw=r2(taxable+totalTax);
 const total=S.company.roundOff?Math.round(raw):raw;
 const exp=r2((inv.expenses||[]).reduce((s,x)=>s+(+x.amount||0),0));
 const profit=r2(taxable-exp);
 return{taxable,groups,tt,cgst,sgst,igst,totalTax,raw,total,round:r2(total-raw),exp,profit,margin:taxable?profit/taxable*100:0};
}
const paidOf=i=>r2((i.payments||[]).reduce((s,p)=>s+(+p.amount||0),0));
function statusOf(i){const t=calc(i).total,p=paidOf(i);if(t>0&&p>=t-0.005)return'Paid';if(p<=0)return'Unpaid';return'Partial'}
const balOf=i=>Math.max(0,r2(calc(i).total-paidOf(i)));

/* ---------------- HISTORY ---------------- */
function filtered(){return allDocs().filter(i=>{
 const dc=i.type==='dc';
 if(!tabOk(i,HT))return false;
 if(F.from&&i.date<F.from)return false;if(F.to&&i.date>F.to)return false;if(F.cust&&i.customerId!==F.cust)return false;
 if(F.no){const q=F.no.toLowerCase();if(!(String(i.no).toLowerCase().includes(q)||String(i.cust.name||'').toLowerCase().includes(q)))return false}
 if(F.svc){const sv=S.services.find(s=>s.id===F.svc);if(dc){if(!sv||!String(i.process||'').toLowerCase().includes(sv.name.toLowerCase()))return false}else if(!i.lines.some(l=>l.serviceId===F.svc))return false}
 if(F.status&&(dc||statusOf(i)!==F.status))return false;return true}).sort(bySeqDesc)}
V.history=()=>`<div class="head"><h2>History</h2><button class="btn" onclick="A.csv()">⬇ Export invoices CSV</button></div>
 ${tabsHTML(HT,'A.hTab')}
 <div class="card"><div class="form" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0">
 <div><label>From</label><input type="date" value="${F.from}" onchange="F.from=this.value;histT()"></div><div><label>To</label><input type="date" value="${F.to}" onchange="F.to=this.value;histT()"></div>
 <div><label>Customer</label><select onchange="F.cust=this.value;histT()">${custOptions(F.cust).replace('Select customer','All customers')}</select></div>
 <div><label>Invoice / DC no. or customer</label><input value="${esc(F.no)}" oninput="F.no=this.value;histT()" placeholder="search"></div>
 <div><label>Service</label><select onchange="F.svc=this.value;histT()"><option value="">All services</option>${[...S.services].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${F.svc===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
 <div><label>Payment</label><select onchange="F.status=this.value;histT()">${['','Paid','Unpaid','Partial'].map(x=>`<option value="${x}" ${F.status===x?'selected':''}>${x||'All statuses'}</option>`).join('')}</select></div>
 <div style="align-self:end"><button class="btn" onclick="Object.assign(F,{from:'',to:'',cust:'',no:'',svc:'',status:''});render()">Clear</button></div></div></div>
 <div class="card" id="hist"></div>`;
AFTER.history=()=>histT();
function histT(){
 const list=filtered();let tt=0,pp=0,ni=0;list.forEach(i=>{if(i.type!=='dc'){ni++;tt+=calc(i).total;pp+=paidOf(i)}});
 $('#hist').innerHTML=list.length?`<div class="row" style="margin-bottom:10px"><label style="margin:0"><input type="checkbox" onchange="A.selAll('h',this.checked)"> Select all</label><button class="btn pri" onclick="A.printSel('h')">🖨 Print selected (<span id="cnt_h">${SEL.h.size}</span>)</button><button class="btn bad" onclick="A.delSel('h')">🗑 Delete selected</button></div>
 <div class="scroll"><table class="t"><thead><tr><th></th><th>Type</th><th>No</th><th>Date</th><th>Customer / Details</th><th class="r">Total</th><th class="r">Paid</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(d=>docRow(d,'h',true)).join('')}</tbody>
 <tfoot><tr><td></td><td colspan="4">${list.length} documents (${ni} invoices)</td><td class="r">${money(tt)}</td><td class="r">${money(pp)}</td><td colspan="2">Balance ${money(tt-pp)}</td></tr></tfoot></table></div>`:'<p class="mut">No documents match these filters.</p>';
}
A.csv=()=>{const h=['Invoice','Date','Customer','GSTIN','Taxable','CGST','SGST','IGST','Total','Paid','Balance','Status'];
 const rows=filtered().filter(i=>i.type!=='dc').map(i=>{const k=calc(i);return[i.no,i.date,i.cust.name,i.cust.gstin,k.taxable,k.cgst,k.sgst,k.igst,k.total,paidOf(i),balOf(i),statusOf(i)].map(csvCell).join(',')});
 download('invoices.csv',[h.join(','),...rows].join('\n'),'text/csv')};

A.payModal=id=>{const i=S.invoices.find(x=>x.id===id);if(!i)return;const t=calc(i).total,p=paidOf(i);
 modal(`<h3>Payments – ${esc(i.no)} · ${esc(i.cust.name)}</h3><div class="tot" style="margin-bottom:12px"><div>Invoice total</div><div>${money(t)}</div><div>Received</div><div>${money(p)}</div><div class="big">Balance</div><div class="big ${t-p>0.005?'badc':'good'}">${money(Math.max(0,t-p))}</div></div>
 ${(i.payments||[]).length?`<table class="t" style="margin-bottom:12px"><tbody>${i.payments.map((x,n)=>`<tr><td>${dmy(x.date)}</td><td>${esc(x.mode)}${x.note?' · '+esc(x.note):''}</td><td class="r">${money(x.amount)}</td><td><button class="btn sm bad" onclick="A.delPay('${id}',${n})">✕</button></td></tr>`).join('')}</tbody></table>`:''}
 <div class="form"><div><label>Amount ₹</label><input id="p_amt" type="number" step="any" inputmode="decimal" value="${Math.max(0,r2(t-p))||''}"></div><div><label>Date</label><input id="p_date" type="date" value="${today()}"></div>
 <div><label>Mode</label><select id="p_mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select></div><div><label>Note</label><input id="p_note" placeholder="ref / cheque no."></div></div>
 <div class="row"><button class="btn pri" onclick="A.addPay('${id}')">Add payment</button><button class="btn" onclick="closeModal();render()">Close</button></div>`)};
A.addPay=id=>{const i=S.invoices.find(x=>x.id===id),a=+$('#p_amt').value;if(!(a>0))return toast('Enter an amount');
 (i.payments=i.payments||[]).push({amount:a,date:$('#p_date').value,mode:$('#p_mode').value,note:$('#p_note').value.trim()});put('invoices',i);A.payModal(id)};
A.delPay=(id,n)=>{const i=S.invoices.find(x=>x.id===id);i.payments.splice(n,1);put('invoices',i);A.payModal(id)};

 modal(`<h3>${id?'Edit':'New'} customer</h3><div class="form"><div class="span2"><label>Customer / Company name *</label><input id="c_name" value="${esc(c.name)}"></div>
 <div class="span2"><label>Address</label><textarea id="c_addr" rows="3">${esc(c.address)}</textarea></div>

 <div><label>GSTIN</label><input id="c_gstin" value="${esc(c.gstin)}" maxlength="15" oninput="A.gstState(this.value)" style="text-transform:uppercase"></div>
 <div><label>State (decides CGST/SGST vs IGST)</label><select id="c_state">${STATES.map(s=>`<option value="${s[0]}" ${s[0]===(c.stateCode||S.company.stateCode)?'selected':''}>${s[0]} – ${s[1]}</option>`).join('')}</select></div></div>

 if(!name)return toast('Enter customer name');if(g&&!GSTRE.test(g))return toast('GSTIN format looks invalid');
 const o=put('customers',{...(S.customers.find(x=>x.id===id)||{}),id:id||undefined,name,address:$('#c_addr').value.trim(),phone:$('#c_phone').value.trim(),email:$('#c_email').value.trim(),gstin:g,stateCode:g?g.slice(0,2):$('#c_state').value});
 closeModal();if(afterCust==='dc'&&D){$('#d_cust').innerHTML=custOptions(o.id);A.pickDcCust(o.id)}else if(afterCust&&E){$('#e_cust').innerHTML=custOptions(o.id);A.pickCust(o.id)}else render()};

V.services=()=>`<div class="head"><div><h2>Services &amp; Rates</h2><span class="mut">Rates and GST here auto-fill on every new invoice. Past invoices are not changed.</span></div><button class="btn pri" onclick="A.svcModal('')">+ Add service</button></div>
 <div class="card"><div class="scroll"><table class="t"><thead><tr><th>Service</th><th>HSN/SAC</th><th>Unit</th><th class="r">Rate ₹</th><th class="r">GST %</th><th>Active</th><th></th></tr></thead><tbody>
 ${[...S.services].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.hsn)}</td><td>${esc(s.unit)}</td><td class="r"><input type="number" step="any" value="${s.rate}" style="width:90px;text-align:right" onchange="A.quickRate('${s.id}',this.value)"></td><td class="r">${s.gst}%</td><td><input type="checkbox" ${s.active!==false?'checked':''} onchange="A.svcActive('${s.id}',this.checked)"></td><td><div class="acts"><button class="btn sm" onclick="A.svcModal('${s.id}')">✏️</button><button class="btn sm bad" onclick="A.svcDel('${s.id}')">🗑</button></div></td></tr>`).join('')}</tbody></table></div></div>`;

 <div><label>Unit</label><input id="s_u" list="unitList" value="${esc(s.unit)}"></div><div><label>Rate ₹ per unit</label><input id="s_r" type="number" step="any" value="${s.rate??''}"></div>
 <div><label>GST %</label><input id="s_g" list="gstList" type="number" step="any" value="${s.gst}"></div><div><label>HSN / SAC</label><input id="s_h" value="${esc(s.hsn)}"></div></div>

/* ---------------- REPORTS ---------------- */
V.reports=()=>{
 const list=S.invoices.filter(i=>i.date>=REP.from&&i.date<=REP.to);
 let rev=0,tax=0,gst=0,exp=0,pend=0;const sv={},cs={},ex={};
 list.forEach(i=>{const k=calc(i),b=balOf(i);rev+=k.total;tax+=k.taxable;gst+=k.totalTax;exp+=k.exp;pend+=b;
  i.lines.forEach(l=>{const o=sv[l.name]||(sv[l.name]={n:0,qty:0,unit:l.unit,amt:0});o.n++;o.qty+=+l.qty;o.amt+=r2(l.qty*l.rate)});
  const key=i.customerId||i.cust.name,o=cs[key]||(cs[key]={name:i.cust.name,n:0,total:0,paid:0,profit:0});o.n++;o.total+=k.total;o.paid+=paidOf(i);o.profit+=k.profit;
  (i.expenses||[]).forEach(x=>{ex[x.desc]=(ex[x.desc]||0)+(+x.amount||0)})});
 const profit=tax-exp;
 return `<div class="head"><h2>Reports</h2><div class="row"><input type="date" value="${REP.from}" style="width:150px" onchange="REP.from=this.value;render()"><span>to</span><input type="date" value="${REP.to}" style="width:150px" onchange="REP.to=this.value;render()">
 <button class="btn" onclick="REP.from=monthStart();REP.to=today();render()">This month</button><button class="btn" onclick="REP.from=today().slice(0,4)+'-01-01';REP.to=today();render()">This year</button></div></div>
 <div class="stats"><div class="stat"><span>Invoices</span><b>${list.length}</b></div><div class="stat"><span>Taxable revenue</span><b>${money(tax)}</b></div><div class="stat"><span>GST collected</span><b>${money(gst)}</b></div><div class="stat"><span>Invoice total</span><b>${money(rev)}</b></div>
 <div class="stat"><span>Purchase cost / expenses</span><b>${money(exp)}</b></div><div class="stat"><span>Profit</span><b class="${profit>=0?'good':'badc'}">${money(profit)}</b></div><div class="stat"><span>Pending</span><b class="badc">${money(pend)}</b></div></div>
 <div class="card"><h3>Service-wise</h3><div class="scroll"><table class="t"><thead><tr><th>Service</th><th class="r">Invoices</th><th class="r">Quantity</th><th class="r">Revenue (taxable)</th></tr></thead><tbody>${Object.entries(sv).sort((a,b)=>b[1].amt-a[1].amt).map(([n,o])=>`<tr><td>${esc(n)}</td><td class="r">${o.n}</td><td class="r">${num(o.qty)} ${esc(o.unit)}</td><td class="r">${money(o.amt)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">No data</td></tr>'}</tbody></table></div></div>
 <div class="card"><h3>Customer-wise</h3><div class="scroll"><table class="t"><thead><tr><th>Customer</th><th class="r">Invoices</th><th class="r">Billed</th><th class="r">Received</th><th class="r">Pending</th><th class="r">Profit</th></tr></thead><tbody>${Object.values(cs).sort((a,b)=>b.total-a.total).map(o=>`<tr><td>${esc(o.name)}</td><td class="r">${o.n}</td><td class="r">${money(o.total)}</td><td class="r">${money(o.paid)}</td><td class="r ${o.total-o.paid>0.5?'badc':''}">${money(Math.max(0,o.total-o.paid))}</td><td class="r">${money(o.profit)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No data</td></tr>'}</tbody></table></div></div>
 <div class="card"><h3>Purchase cost breakdown</h3><table class="t"><tbody>${Object.entries(ex).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="r">${money(v)}</td></tr>`).join('')||'<tr><td class="mut">No expenses recorded</td></tr>'}</tbody></table></div>`;
};

 <p class="note">GST % is also editable per service and per invoice line. CGST/SGST vs IGST is chosen automatically from the customer's state, and can be overridden on each invoice.</p></div>
 <div class="card"><h3>Cloud sync (multiple devices)</h3><p class="note" style="margin-top:0">${fs?`Connected as <b>${esc(USER)}</b>. Changes sync live across all devices signed in.`:'Currently saving only in this browser. Follow README.md to create a free Firebase project, then paste its config below.'}</p>
 ${typeof FIREBASE_CONFIG==='object'&&FIREBASE_CONFIG?'<p class="note">Config is built into index.html.</p>':`<textarea id="fbcfg" rows="4" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'>${esc(localStorage.getItem('tb_fb')||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn pri" onclick="A.saveFb()">Save &amp; connect</button>${localStorage.getItem('tb_fb')?'<button class="btn" onclick="A.rmFb()">Disconnect</button>':''}</div>`}
 ${fs?'<div style="margin-top:10px"><button class="btn" onclick="auth.signOut().then(()=>location.reload())">Sign out</button></div>':''}</div>
 <div class="card"><h3>Backup</h3><div class="row"><button class="btn" onclick="A.backup()">⬇ Download backup (JSON)</button><label class="btn" style="margin:0">⬆ Restore from backup<input type="file" accept=".json" hidden onchange="A.restore(this)"></label></div>
 <p class="note">Tip: take a backup now and then. If you move from local mode to cloud sync, restore your backup after connecting to upload existing data.</p></div>`;
};
A.saveSettings=prev=>{
 const c={...S.company};
 ['name','tagline','address','phone','email','web','pan','bankBranch','bankAcc','bankIfsc','terms','footer','sigLabel','invTitle','prefix','gstRates','expensePresets','stateCode','paper','copies','dcName','dcSub','dcGstin','dcCell','dcOffice','dcBOffice','dcPrefix','dcHsn','dcNote1','dcNote2'].forEach(k=>c[k]=$('#s_'+k).value);
 ['pad','fontSize','defaultGst'].forEach(k=>c[k]=+$('#s_'+k).value||0);
 ['showLogo','showBank','showTerms','roundOff'].forEach(k=>c[k]=$('#s_'+k).checked);
 const g=$('#s_gstin').value.trim().toUpperCase();if(g&&!GSTRE.test(g))return toast('Your GSTIN format looks invalid');
 c.gstin=g;if(g)c.stateCode=g.slice(0,2);
 S.company=c;saveCompany();
 const dn=+$('#s_dcnext').value;if(dn>=1&&dn!==(S.meta.dcCounter||0)+1)setCounter(dn-1,'dc');
 const nx=+$('#s_next').value;if(nx>=1&&nx!==(S.meta.counter||0)+1)setCounter(nx-1);
 toast('Settings saved');render();
 if(prev===true)A.view_sample();
};
A.view_sample=()=>{const inv={no:(S.company.prefix||'')+String(1).padStart(+S.company.pad||1,'0'),date:today(),ref:'LOT-101',cust:{name:'Sample Customer',address:'12, Market Road\nTiruppur',phone:'9876543210',gstin:'33ABCDE1234F1Z5',stateCode:'33'},
 terms:'Credit',lines:S.services.slice(0,3).map((s,n)=>({...s,partyDc:String(81-n),dcNo:'25-26/652'+n,width:'58"',pcs:5,qty:259.7})),expenses:[],payments:[]};
 modal(`<div class="row" style="margin-bottom:10px"><button class="btn" style="margin-left:auto" onclick="closeModal()">Close</button></div><div style="overflow:auto">${invoiceHTML(inv,'')}</div>`,true)};
A.logo=inp=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=400,s=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.company.logo=cv.toDataURL('image/png');saveCompany();toast('Logo updated');render()};im.src=r.result};r.readAsDataURL(f)};
A.rmLogo=()=>{S.company.logo='';saveCompany();render()};
A.saveFb=()=>{const t=$('#fbcfg').value.trim();if(!t)return;try{const cfg=Function('return ('+t+')')();if(!cfg.apiKey||!cfg.projectId)throw 0;localStorage.setItem('tb_fb',JSON.stringify(cfg));location.reload()}catch(e){toast('Could not read that config. Paste the firebaseConfig object.')}};
A.rmFb=()=>{if(confirm('Disconnect cloud sync on this device?')){localStorage.removeItem('tb_fb');location.reload()}};
A.backup=()=>download('billing-backup-'+today()+'.json',JSON.stringify({company:S.company,customers:S.customers,services:S.services,invoices:S.invoices,challans:S.challans,counter:S.meta.counter,dcCounter:S.meta.dcCounter||0}),'application/json');
A.restore=inp=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
 if(!confirm('Restore '+(d.invoices||[]).length+' invoices, '+(d.customers||[]).length+' customers and '+(d.services||[]).length+' services? Same-ID records will be overwritten.'))return;
 S.company={...DEF_COMPANY,...d.company};saveCompany();['customers','services','invoices','challans'].forEach(c=>(d[c]||[]).forEach(o=>put(c,o)));
 if(d.counter>(S.meta.counter||0))setCounter(d.counter);if(d.dcCounter>(S.meta.dcCounter||0))setCounter(d.dcCounter,'dc');toast('Backup restored');render()}catch(e){toast('Invalid backup file')}};r.readAsText(f)};

/* ---------------- app login + master settings ---------------- */
const CRED_KEY='tb_cred',SESS_KEY='tb_auth',DEF_USER='STMW',DEF_PASS='NKS01';
async function pwHash(p){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tb|'+p));return 'sha256:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return 'plain:'+p}
async function saveCred(u,p){localStorage.setItem(CRED_KEY,JSON.stringify({u:u,p:await pwHash(p)}))}
function getCred(){try{const c=JSON.parse(localStorage.getItem(CRED_KEY)||'null');if(c&&c.u&&c.p)return c}catch(e){}return null}
async function ensureCred(){if(!getCred())await saveCred(DEF_USER,DEF_PASS)}
A.gateLogin=async e=>{e.preventDefault();const u=$('#g_user').value.trim(),p=$('#g_pass').value;await ensureCred();const c=getCred();
 if(u===c.u&&await pwHash(p)===c.p){sessionStorage.setItem(SESS_KEY,'1');$('#gateErr').textContent='';enterApp()}
 else{$('#gateErr').textContent='Incorrect username or password.';$('#g_pass').value='';$('#g_pass').focus()}
 return false};
const RECOVERY_PIN='9999';
A.recToggle=on=>{$('#recBox').hidden=!on;$('#recLink').hidden=on;$('#recErr').textContent='';$('#g_pin').value='';if(on)$('#g_pin').focus()};
A.recReset=async()=>{
 if($('#g_pin').value.trim()!==RECOVERY_PIN){$('#recErr').textContent='Incorrect recovery PIN.';$('#g_pin').value='';$('#g_pin').focus();return}
 localStorage.removeItem(CRED_KEY);await saveCred(DEF_USER,DEF_PASS);
 A.recToggle(false);$('#gateErr').textContent='';$('#g_user').value=DEF_USER;$('#g_pass').value='';$('#g_pass').focus();
 alert('Login has been reset.\n\nUsername: '+DEF_USER+'\nPassword: '+DEF_PASS)};
A.logout=()=>{sessionStorage.removeItem(SESS_KEY);location.reload()};
V.master=()=>{const c=getCred()||{u:DEF_USER};
 return `<div class="head"><h2>Master Settings</h2></div>
 <div class="card"><h3>Change login username &amp; password</h3>
  <p class="note" style="margin-top:0">Current username: <b>${esc(c.u)}</b>. Enter a new username and password and save – the old password is not required. The new details are used from the next login.</p>
  <div class="form" style="max-width:520px">
   <div><label>New Username</label><input id="m_user" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
   <div><label>New Password</label><input id="m_pass" type="password" autocomplete="new-password"></div>
  </div>
  <label class="chk" style="display:flex;gap:6px;align-items:center;font-size:13px;margin-top:8px;font-weight:400;cursor:pointer"><input type="checkbox" style="width:auto" onchange="$('#m_pass').type=this.checked?'text':'password'"> Show password</label>
  <div class="row" style="margin-top:14px"><button class="btn pri" onclick="A.saveMaster()">💾 Save Changes</button><button class="btn" onclick="A.resetMaster()">↺ Reset to Default</button></div>
 </div>`};
A.saveMaster=async()=>{const u=$('#m_user').value.trim(),p=$('#m_pass').value;
 if(!u||!p)return toast('Enter both a new username and a new password');
 await saveCred(u,p);toast('Login details updated. Use them next time you sign in.');render()};
A.resetMaster=async()=>{if(!confirm('Reset login to the default username and password?'))return;
 await saveCred(DEF_USER,DEF_PASS);toast('Login reset to default');render()};
function enterApp(){$('#gate').hidden=true;$('#logoutBtn').hidden=false;if(!enterApp.done){enterApp.done=true;bootApp()}}

/* ---------------- boot ---------------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}
A.login=()=>{$('#loginErr').textContent='';auth.signInWithEmailAndPassword($('#l_email').value.trim(),$('#l_pass').value).catch(e=>$('#loginErr').textContent=e.message)};
function listen(){
 ['customers','services','invoices','challans'].forEach(c=>fs.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));onData()},e=>toast('Sync error: '+e.message)));
 fs.doc('meta/company').onSnapshot(d=>{
  if(d.exists)S.company={...DEF_COMPANY,...d.data()};
  else if(!d.metadata.fromCache&&!seeded){seeded=true;saveCompany();seedServices()}
  onData()});
 fs.doc('meta/counter').onSnapshot(d=>{S.meta.counter=d.exists?d.data().n:0});
 fs.doc('meta/dcCounter').onSnapshot(d=>{S.meta.dcCounter=d.exists?d.data().n:0});
}
async function initCloud(cfg){
 const base='https://www.gstatic.com/firebasejs/10.12.2/';
 for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await loadScript(base+f);
 firebase.initializeApp(cfg);auth=firebase.auth();const db=firebase.firestore();
 try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
 auth.onAuthStateChanged(u=>{
  if(u){USER=u.email;$('#login').hidden=true;$('#app').hidden=false;if(!fs){fs=db;listen()}render()}
  else{$('#app').hidden=true;$('#login').hidden=false}
 });
}
function initLocal(){
 try{const d=JSON.parse(localStorage.getItem('tb_data')||'null');if(d){S.company={...DEF_COMPANY,...d.company};S.customers=d.customers||[];S.services=d.services||[];S.invoices=d.invoices||[];S.challans=d.challans||[];S.meta={counter:0,dcCounter:0,...(d.meta||{})}}else{seedServices()}}catch(e){seedServices()}
 $('#app').hidden=false;render();
}
async function bootApp(){
 let cfg=FIREBASE_CONFIG;if(!cfg){try{cfg=JSON.parse(localStorage.getItem('tb_fb')||'null')}catch(e){}}
 if(!cfg)return initLocal();
 try{await initCloud(cfg)}catch(e){document.body.innerHTML=`<div style="padding:30px;font-family:sans-serif"><h3>Could not connect to cloud database</h3><p>${esc(e.message)}</p><p>Check your internet connection.</p><button onclick="location.reload()">Retry</button> <button onclick="localStorage.removeItem('tb_fb');location.reload()">Use local mode instead</button></div>`}
}
(async function gateInit(){
 await ensureCred();
 if(sessionStorage.getItem(SESS_KEY)==='1')enterApp();
 else{$('#gate').hidden=false;$('#g_user').focus()}
})();
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
